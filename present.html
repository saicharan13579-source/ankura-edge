<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ankura – Edge · A Day at Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300;1,9..144,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bone:#F1EEE6; --bone-2:#E8E3D7; --paper:#FBFAF6; --forest:#141B12; --forest-2:#1E2A1B;
  --ink:#22281F; --ink-2:#5B6353; --mute:#868D7C; --line:rgba(34,40,31,.14);
  --clay:#B0603F; --sprout:#9DB267; --jac:#A493DB; --gold:#E2B86B; --sky:#7FB2D9;
  --serif:"Fraunces",Georgia,serif; --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --ease:cubic-bezier(.2,.7,.1,1); --ease2:cubic-bezier(.65,0,.35,1);
  --fm:var(--sans); --fd:var(--sans);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --pad:clamp(20px,4.4vw,72px);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--forest);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{padding-top:var(--safe-t);padding-bottom:var(--safe-b)}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block;max-width:100%}
a{color:inherit}

/* ---------------- deck ---------------- */
#deck{position:fixed;inset:var(--safe-t) 0 var(--safe-b) 0;overflow:hidden}
.slide{position:absolute;inset:0;display:grid;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .9s var(--ease),visibility 0s linear .9s;overflow:hidden;background:var(--bone);color:var(--ink)}
.slide.dark{background:var(--forest);color:#EEF0E6}
.slide.is-active{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .9s var(--ease),visibility 0s}
.slide.is-active{z-index:2}
.slide.leaving{z-index:1}
.inner{position:relative;z-index:2;padding:calc(84px + 2vh) var(--pad) calc(96px + 2vh);height:100%;min-height:0}

/* reveal choreography */
[data-a]{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform 1.1s var(--ease);transition-delay:0s}
[data-a="fade"]{transform:none}
[data-a="left"]{transform:translateX(-40px)}
[data-a="right"]{transform:translateX(40px)}
[data-a="zoom"]{transform:scale(.94)}
[data-a="mask"]{opacity:1;transform:none;clip-path:inset(0 100% 0 0);transition:clip-path 1.3s var(--ease2)}
.is-active [data-a]{opacity:1;transform:none;transition-delay:calc(var(--d,0) * 110ms + 250ms)}
.is-active [data-a="mask"]{clip-path:inset(0 0 0 0)}
.split .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em;margin-bottom:-.08em}
.split .w>span{display:inline-block;transform:translateY(105%);transition:transform 1.1s var(--ease)}
.is-active .split .w>span{transform:none;transition-delay:calc(var(--i) * 55ms + var(--d,0) * 110ms + 250ms)}

/* type */
.kicker{font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--clay);margin:0 0 18px;display:flex;align-items:center;gap:14px}
.dark .kicker{color:var(--gold)}
.kicker .tm{font-variant-numeric:tabular-nums;letter-spacing:.12em;padding:3px 10px;border-radius:99px;border:1px solid currentColor}
h1,h2,h3{font-family:var(--serif);font-weight:300;margin:0;letter-spacing:-.02em;line-height:1.02}
h2{font-size:clamp(40px,5.6vw,92px)}
h2 em,h1 em{font-style:italic;color:var(--clay)}
.dark h2 em,.dark h1 em{color:var(--gold)}
h3{font-size:clamp(24px,2.2vw,34px)}
.lede{font-size:clamp(16px,1.25vw,20px);line-height:1.6;color:var(--ink-2);max-width:52ch;margin:22px 0 0;font-weight:300}
.dark .lede{color:rgba(238,240,230,.78)}
.story{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(18px,1.5vw,24px);line-height:1.45;color:var(--ink-2);max-width:44ch;margin:0}
.dark .story{color:rgba(238,240,230,.85)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.chip{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;padding:7px 13px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2)}
.dark .chip{border-color:rgba(255,255,255,.22);color:rgba(238,240,230,.86)}

/* ---------------- chrome ---------------- */
.ui-top{position:fixed;z-index:20;left:0;right:0;top:var(--safe-t);display:flex;align-items:center;gap:18px;padding:18px var(--pad);pointer-events:none;color:#fff;mix-blend-mode:difference}
.ui-top>*{pointer-events:auto}
.brand{font-family:var(--serif);font-size:20px;letter-spacing:-.01em;text-decoration:none;white-space:nowrap}
.brand small{font-family:var(--sans);font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;margin-left:12px;opacity:.7}
.chap{flex:1;text-align:center;font-size:11px;letter-spacing:.3em;text-transform:uppercase;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;font-size:14px;letter-spacing:.06em}
.clock .sun{width:22px;height:22px;position:relative}
.clock .sun svg{width:100%;height:100%}
.ui-btns{display:flex;gap:6px;position:fixed;z-index:21;right:var(--pad);bottom:calc(22px + var(--safe-b))}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.28);background:rgba(20,27,18,.42);color:#fff;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:grid;place-items:center;font-size:16px;transition:background .3s,transform .2s}
.ib:hover{background:rgba(20,27,18,.7);transform:translateY(-1px)}
.ib[aria-pressed="true"]{background:var(--clay);border-color:var(--clay)}
.ib svg{width:18px;height:18px}
.ui-count{position:fixed;z-index:21;left:var(--pad);bottom:calc(30px + var(--safe-b));font-size:12px;letter-spacing:.2em;font-variant-numeric:tabular-nums;color:#fff;mix-blend-mode:difference}
.ui-count b{font-family:var(--serif);font-size:26px;font-weight:300;letter-spacing:0;margin-right:6px}
.progress{position:fixed;z-index:21;left:0;right:0;bottom:var(--safe-b);height:3px;background:rgba(255,255,255,.12)}
.progress i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--sprout),var(--gold),var(--clay));transition:width .9s var(--ease)}
.progress .ap{position:absolute;inset:0 auto 0 0;height:100%;background:rgba(255,255,255,.55);width:0}
.chapters{position:fixed;z-index:21;left:50%;transform:translateX(-50%);bottom:calc(28px + var(--safe-b));display:flex;gap:5px;align-items:center}
.chapters button{width:26px;height:16px;border:0;background:none;padding:0;display:grid;place-items:center}
.chapters button i{display:block;width:100%;height:2px;border-radius:2px;background:rgba(255,255,255,.35);transition:background .3s,height .3s}
.chapters button.on i{background:#fff;height:3px}
.chapters button.cur i{background:var(--gold)}
.chapters{mix-blend-mode:difference}
@media (max-width:720px){.chapters{display:none}.brand small{display:none}.chap{display:none}.ui-top{justify-content:space-between}}

/* overview */
.overview{position:fixed;inset:0;z-index:40;background:rgba(14,19,12,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);color:#fff;overflow:auto;padding:calc(80px + var(--safe-t)) var(--pad) 60px;opacity:0;pointer-events:none;transition:opacity .4s}
.overview.open{opacity:1;pointer-events:auto}
.overview h4{font-family:var(--serif);font-weight:300;font-size:28px;margin:30px 0 14px}
.overview h4 small{font-family:var(--sans);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-right:12px}
.ov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.ov{border:1px solid rgba(255,255,255,.14);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.04);text-align:left;padding:0;display:grid;transition:transform .25s,border-color .25s}
.ov:hover{transform:translateY(-3px);border-color:var(--gold)}
.ov .th{aspect-ratio:16/9;background:#2a3326 center/cover}
.ov span{padding:10px 12px;font-size:13px;display:flex;gap:10px}
.ov span b{color:var(--gold);font-weight:600;font-variant-numeric:tabular-nums}
.ov-close{position:fixed;top:calc(20px + var(--safe-t));right:var(--pad);z-index:41}

/* ---------------- media ---------------- */
.bg{position:absolute;inset:0;z-index:0;overflow:hidden;background:#1d241a}
.bg img,.bg .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s var(--ease)}
.bg img.on{opacity:1}
.kb img.on{animation:kb 14s ease-out forwards}
@keyframes kb{from{transform:scale(1.14) translate(1.5%,1%)}to{transform:scale(1.02) translate(0,0)}}
.kb.alt img.on{animation-name:kb2}
@keyframes kb2{from{transform:scale(1.04) translate(-1.5%,0)}to{transform:scale(1.15) translate(1%,-1%)}}
.shade-l::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,14,9,.82) 0%,rgba(10,14,9,.55) 34%,rgba(10,14,9,0) 70%),linear-gradient(0deg,rgba(10,14,9,.55),rgba(10,14,9,0) 40%)}
.shade-b::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,14,9,.88) 0%,rgba(10,14,9,.35) 45%,rgba(10,14,9,.15) 100%)}
.shade-c::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(10,14,9,.25),rgba(10,14,9,.75))}
.zoomable{cursor:zoom-in}

/* thumbs strip */
.strip{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:0 0 auto;width:clamp(76px,7.2vw,118px);aspect-ratio:16/10;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;background:#2a3326;opacity:.62;transition:opacity .3s,border-color .3s,transform .3s;position:relative}
.strip button img{width:100%;height:100%;object-fit:cover}
.strip button:hover{opacity:1;transform:translateY(-2px)}
.strip button.on{opacity:1;border-color:var(--gold)}
.strip button .bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--gold)}
.strip button.on .bar{animation:barfill var(--gdur,6s) linear forwards}
.paused .strip button.on .bar{animation-play-state:paused}
@keyframes barfill{to{width:100%}}
.cap{font-size:13px;color:rgba(238,240,230,.8);display:flex;gap:12px;align-items:baseline;min-height:20px}
.cap b{font-weight:600;color:#fff}
.cap span{opacity:.7}

/* ================= LANDING ================= */
#s-landing{background:#0B0F0A;color:#fff}
#s-landing .bg img{filter:saturate(1.05)}
.land-veil{position:absolute;inset:0;z-index:1;background:radial-gradient(ellipse 80% 70% at 30% 60%,rgba(8,11,7,.15),rgba(8,11,7,.78)),linear-gradient(0deg,rgba(8,11,7,.85),rgba(8,11,7,0) 55%)}
.land-tint{position:absolute;inset:0;z-index:1;mix-blend-mode:soft-light;transition:background 1.4s linear}
.land-plan{position:absolute;z-index:1;right:-4vw;top:8vh;width:min(72vw,1200px);opacity:.55;pointer-events:none;mix-blend-mode:screen}
.land-plan path{fill:none;stroke:rgba(255,255,255,.75);stroke-width:1.3;stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.is-active .land-plan path{animation:draw 4.2s var(--ease2) forwards;animation-delay:calc(var(--k) * 40ms + .3s)}
.is-active .land-plan{animation:planfade 9s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes planfade{0%{opacity:.75}55%{opacity:.6}100%{opacity:.16}}
.land{position:relative;z-index:3;height:100%;display:grid;align-content:end;padding:0 var(--pad) calc(120px + 4vh)}
.land .kicker{color:var(--gold)}
.land h1{font-size:clamp(60px,11vw,190px);font-weight:300;letter-spacing:-.045em;line-height:.86;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .18em}
.land h1 .dash{display:inline-block;width:.5em;height:.06em;background:var(--sprout);transform:scaleX(0);transform-origin:left;transition:transform 1.2s var(--ease) 1.1s;align-self:center}
.is-active .land h1 .dash{transform:scaleX(1)}
.land h1 .ch{display:inline-block;opacity:0;transform:translateY(.4em) rotate(4deg);filter:blur(10px);transition:opacity 1s var(--ease),transform 1.2s var(--ease),filter 1.2s var(--ease)}
.is-active .land h1 .ch{opacity:1;transform:none;filter:none;transition-delay:calc(var(--i) * 70ms + .5s)}
.land .sub{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(20px,2.2vw,34px);margin:18px 0 0;color:rgba(255,255,255,.88)}
.land-row{display:flex;flex-wrap:wrap;gap:16px 40px;align-items:center;margin-top:38px}
.begin{display:inline-flex;align-items:center;gap:14px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;border-radius:99px;padding:10px 22px 10px 10px;font-size:12px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;transition:background .3s}
.begin:hover{background:rgba(255,255,255,.16)}
.begin i{width:40px;height:40px;border-radius:50%;background:var(--sprout);display:grid;place-items:center;position:relative}
.begin i::before{content:"";border-left:11px solid #14200f;border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.begin i::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid var(--sprout);animation:ping 2.4s ease-out infinite}
@keyframes ping{from{opacity:.8;transform:scale(.85)}to{opacity:0;transform:scale(1.5)}}
.land-meta{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.62);line-height:2}
.land-clock{position:absolute;z-index:3;right:var(--pad);top:calc(96px + 4vh);text-align:right;color:#fff}
.land-clock b{display:block;font-family:var(--serif);font-weight:300;font-size:clamp(54px,7vw,120px);line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.land-clock span{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:rgba(255,255,255,.7)}
.land-day{position:absolute;z-index:3;right:var(--pad);top:calc(96px + 4vh + clamp(70px,8.6vw,140px));width:min(260px,40vw);height:2px;background:rgba(255,255,255,.2)}
.land-day i{position:absolute;inset:0 auto 0 0;background:var(--gold);width:0}
.scrollcue{position:absolute;z-index:3;left:50%;bottom:calc(80px + 2vh);transform:translateX(-50%);width:24px;height:38px;border:1.5px solid rgba(255,255,255,.5);border-radius:14px}
.scrollcue::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:8px;margin-left:-1.5px;border-radius:2px;background:#fff;animation:cue 1.8s ease-in-out infinite}
@keyframes cue{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
.grain{position:absolute;inset:-50%;z-index:2;pointer-events:none;opacity:.06;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");animation:grain 1.2s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}60%{transform:translate(-2%,-1%)}80%{transform:translate(3%,3%)}100%{transform:translate(0,0)}}

/* ================= PROLOGUE / statement ================= */
.inner.statement-s{display:grid;align-content:center;max-width:1500px}
.bigq{font-family:var(--serif);font-weight:300;font-size:clamp(28px,3.5vw,60px);line-height:1.14;letter-spacing:-.02em;max-width:28ch;margin:0}
.bigq em{color:var(--clay)}
.dark .bigq em{color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;margin-top:clamp(36px,6vh,72px);border-top:1px solid var(--line)}
.stat{padding:22px 18px 0 0;border-right:1px solid var(--line);margin-right:18px}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--serif);font-weight:300;font-size:clamp(34px,3.6vw,62px);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat b small{font-size:.38em;letter-spacing:0;margin-left:4px;color:var(--ink-2)}
.stat b span{display:inline;font:inherit;letter-spacing:inherit;text-transform:none;color:inherit;margin:0}
.stat>span{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin-top:12px;line-height:1.5}
@media (max-width:1100px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{border-right:0;border-bottom:1px solid var(--line);padding-bottom:18px}}

/* chapter dividers */
.inner.chapter{display:grid;align-content:end;padding-bottom:calc(120px + 6vh)}
.chapter .num{font-family:var(--serif);font-weight:300;font-size:clamp(90px,16vw,260px);line-height:.8;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.55);position:absolute;right:var(--pad);top:calc(84px + 4vh);letter-spacing:-.04em}
.chapter.light .num{-webkit-text-stroke-color:rgba(34,40,31,.25)}
.chapter h2{font-size:clamp(56px,8.5vw,150px)}

/* ================= aerial ================= */
.inner.aerial{display:grid;align-content:end;grid-template-columns:minmax(0,1fr) auto;gap:30px;align-items:end}
.toggle{display:inline-flex;border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:4px;background:rgba(10,14,9,.35);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.toggle button{border:0;background:none;border-radius:99px;padding:8px 16px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75);transition:background .3s,color .3s}
.toggle button[aria-pressed="true"]{background:#fff;color:var(--forest)}
.facts{display:grid;gap:12px;max-width:380px}
.fact{display:grid;grid-template-columns:28px 1fr;gap:12px;font-size:14px;line-height:1.5;color:rgba(238,240,230,.86);padding:12px 14px;border-radius:14px;background:rgba(10,14,9,.42);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12)}
.fact i{font-style:normal;font-family:var(--serif);font-size:20px;color:var(--gold);line-height:1.1}
.fact b{color:#fff;font-weight:600}

/* ================= zoning ================= */
.inner.zoning{display:grid;grid-template-columns:minmax(260px,360px) minmax(0,1fr);gap:clamp(20px,3vw,48px);align-items:center}
.zlist{display:grid;gap:2px;margin-top:18px;max-height:36vh;overflow:auto;scrollbar-width:thin}
.zlist button{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;border:0;background:none;padding:7px 8px;border-radius:10px;font-size:14px;transition:background .25s}
.zlist button:hover,.zlist button.on{background:rgba(176,96,63,.1)}
.zlist .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;color:#fff;background:var(--clay)}
.zlist .park .n{background:#5C6B4A}
.zlist small{color:var(--mute);font-variant-numeric:tabular-nums}
.zwrap{position:relative;background:var(--paper);border-radius:22px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(20,30,15,.12);overflow:hidden}
.zwrap svg{width:100%;height:auto;display:block}
.zwrap .pl-villa{transform-box:fill-box;transform-origin:center}
.is-active .zwrap .pl-villa{animation:pop .6s var(--ease) both;animation-delay:calc(var(--v,0) * 4ms + .6s)}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
.zwrap .co{opacity:0;transition:opacity .5s}
.is-active .zwrap .co{opacity:1;transition-delay:calc(var(--c,0) * 120ms + 1.6s)}
.zwrap.focus .co:not(.on){opacity:.18!important;transition-delay:0s}
.zprev{position:absolute;z-index:3;width:240px;border-radius:14px;overflow:hidden;background:var(--forest);color:#fff;box-shadow:0 20px 50px rgba(0,0,0,.35);pointer-events:none;opacity:0;transform:translateY(8px) scale(.96);transition:opacity .25s,transform .25s}
.zprev.on{opacity:1;transform:none}
.zprev img{width:100%;aspect-ratio:16/10;object-fit:cover}
.zprev div{padding:10px 12px;font-size:13px}
.zprev small{display:block;color:var(--gold);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-top:2px}
@media (max-width:900px){.inner.zoning{grid-template-columns:1fr;align-content:start;overflow:auto}.zlist{max-height:none}}
.pl-green{fill:#C8D2AC}
.pl-amen{fill:#E5D2A6}
.pl-road{fill:#BCB5A6}
.pl-block{fill:#EDE8DD}
.pl-villa{fill:#FFFFFF;stroke:#7C8471;stroke-width:.8}
.pl-club{fill:#FFFFFF;stroke:#A4543A;stroke-width:1.4}
.pl-iqon .pl-green{fill:#E2E5D8}
.pl-iqon .pl-amen{fill:#EDE7D9}
.pl-iqon .pl-road{fill:#DCD8CE}
.pl-iqon .pl-block{fill:#F3F1EB}
.pl-iqon .pl-villa{fill:#FBFAF6;stroke:#CFCABF}
.pl-iqon-t{font-family:var(--fm);font-size:22px;letter-spacing:.34em;fill:#9EA394}
.pl-iqon-s{font-family:var(--fm);font-size:13px;letter-spacing:.16em;fill:#B3B7A9}
.co{cursor:pointer;transition:opacity .3s}
.co .lead{fill:none;stroke:#2A2F26;stroke-width:1.1}
.co .ring{fill:rgba(164,84,58,.08);stroke:#A4543A;stroke-width:2;stroke-dasharray:5 4;transition:fill .3s,stroke-width .3s}
.co .dot,.co .badge{fill:#A4543A}
.co .bn{font-family:var(--fm);font-size:13px;font-weight:500;fill:#FFFFFF}
.co .bl{font-family:var(--fd);font-weight:600;font-size:19px;letter-spacing:.08em;fill:#2A2F26;transition:fill .3s}
.co .pulse{fill:none;stroke:#A4543A;stroke-width:1.5;opacity:0;transform-box:fill-box;transform-origin:center;animation:zpulse 3.6s ease-out infinite}
.co.park .ring{fill:rgba(92,107,74,.1);stroke:#5C6B4A}
.co.park .dot,.co.park .badge{fill:#5C6B4A}
.co.park .pulse{stroke:#5C6B4A}
.zwrap.focus .co:not(.on){opacity:.2}
.co.on .ring{fill:rgba(164,84,58,.3);stroke-width:3}
.co.park.on .ring{fill:rgba(92,107,74,.34)}
.co.on .bl{fill:#A4543A}
.co.park.on .bl{fill:#5C6B4A}
.co:focus{outline:none}
.co:focus-visible .bl{text-decoration:underline}
@keyframes zpulse{0%{opacity:.55;transform:scale(1)}70%{opacity:0;transform:scale(1.55)}100%{opacity:0;transform:scale(1.55)}}

/* ================= master layout ================= */
.master{background:linear-gradient(140deg,#EAF1FA,#F1EEE6 55%,#EFEAF7)}
.master .inner{display:grid;grid-template-rows:auto minmax(0,1fr);gap:18px}
.mhead{display:flex;flex-wrap:wrap;gap:12px 40px;align-items:end;justify-content:space-between}
.mhead h2{font-size:clamp(36px,4.2vw,70px)}
.mtiles{display:flex;gap:10px;flex-wrap:wrap}
.mtile{padding:10px 16px;border-radius:16px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);box-shadow:0 8px 28px rgba(30,50,90,.08);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.mtile b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.mtile span{font-size:11.5px;color:var(--ink-2)}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;min-height:0}
.mpanel{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);border-radius:22px;box-shadow:0 16px 50px rgba(30,50,90,.12);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);overflow:hidden;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr)}
.mchips{display:flex;flex-wrap:wrap;gap:5px;padding:10px 12px;border-bottom:1px solid var(--line)}
.mchip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid rgba(34,40,31,.1);background:rgba(255,255,255,.7)}
.mchip i{width:9px;height:9px;border-radius:3px}
.mchip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:transparent}
.mapbox{position:relative;overflow:hidden;background:#fff;touch-action:none;cursor:grab;min-height:0}
.mapbox.drag{cursor:grabbing}
.mapbox svg{width:100%;height:100%;display:block}
.zbtns{position:absolute;right:12px;bottom:12px;display:grid;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.75);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(34,40,31,.1);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.zbtns button{width:40px;height:36px;border:0;background:none;font-size:17px}
.zbtns button+button{border-top:1px solid rgba(34,40,31,.1)}
.mp{fill:#fff;stroke:#7C8471;stroke-width:.8;cursor:pointer;transition:fill .25s,opacity .25s}
.pnum{font-family:var(--sans);font-size:7.5px;font-weight:600;fill:#868D7C;pointer-events:none}
.mp:hover{fill:#F3D9C9;stroke:#B0603F;stroke-width:1.2}
.mp.hl{fill:var(--tc,#E2B86B);stroke:#22281F;stroke-width:1}
.mp.dim{fill:#fff;opacity:.45}
.mp.sel{fill:#B0603F;stroke:#5c2a14;stroke-width:1.6}
.mp.wave{animation:wave 1.4s ease both;animation-delay:calc(var(--w) * 8ms)}
@keyframes wave{0%{fill:#fff}30%{fill:#E9C98A}100%{fill:#fff}}
.mclub{cursor:pointer;transition:fill .25s}
.mclub:hover,.mclub.sel{fill:#F3D9C9!important}
.mlab{font-family:var(--sans);font-weight:700;font-size:11px;letter-spacing:.2em;fill:#A4543A;pointer-events:none}
.mside{padding:18px;overflow:auto;display:block}
.mside h3{font-size:24px;margin:0 0 6px}
.hint{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.legend{display:grid;gap:5px;font-size:12.5px;margin-top:10px}
.legend button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:3px 4px;border-radius:6px;text-align:left}
.legend button:hover{background:rgba(34,40,31,.06)}
.legend i{width:14px;height:10px;border-radius:3px;flex:0 0 auto}
.ftab{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0}
.ftab div{background:rgba(255,255,255,.7);border:1px solid rgba(34,40,31,.08);border-radius:12px;padding:8px 9px}
.ftab b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.ftab span{font-size:10.5px;color:var(--ink-2)}
.bignum{font-family:var(--serif);font-weight:300;font-size:58px;line-height:1;letter-spacing:-.03em}
.vplan{display:block;width:100%;border:1px solid rgba(34,40,31,.1);border-radius:14px;background:#fff;padding:0;overflow:hidden;cursor:zoom-in;margin-top:8px}
.vplan img{width:100%;height:auto}
.pch{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.pch button{font-size:11px;font-weight:600;padding:2px 8px;border-radius:8px;border:1px solid rgba(34,40,31,.12);background:#fff}
.pch button.cur{background:var(--ink);color:#fff}
@media (max-width:1000px){.mgrid{grid-template-columns:1fr;grid-template-rows:60vh auto;overflow:auto}.master .inner{overflow:auto}}

/* ================= villa collection ================= */
.inner.villas{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,3.5vw,60px);align-items:center}
.vlist{display:grid;gap:0;margin-top:18px;max-height:38vh;overflow:auto;scrollbar-width:thin;border-top:1px solid var(--line)}
.vrow{display:grid;grid-template-columns:14px minmax(0,1fr) 54px 72px;gap:14px;align-items:center;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:8px 6px;font-size:14px;transition:background .25s,padding .25s}
.vrow i{width:12px;height:12px;border-radius:3px}
.vrow small{color:var(--mute);font-variant-numeric:tabular-nums;text-align:right}
.vrow b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.vrow:hover{background:rgba(34,40,31,.04)}
.vrow.on{background:var(--forest);color:#fff;padding-left:14px;border-radius:10px}
.vrow.on small{color:rgba(255,255,255,.6)}
.vcard{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:center}
.vplanbig{border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 30px 70px rgba(20,30,15,.14);padding:10px;cursor:zoom-in;transition:transform .5s var(--ease)}
.vplanbig:hover{transform:translateY(-4px) rotate(-.4deg)}
.vplanbig img{width:100%;height:auto;max-height:62vh;object-fit:contain;transition:opacity .4s}
.vinfo .size{font-family:var(--serif);font-weight:300;font-size:clamp(64px,7vw,120px);line-height:.9;letter-spacing:-.04em}
.vinfo .size small{font-size:.24em;letter-spacing:.1em;text-transform:uppercase;font-family:var(--sans);margin-left:6px;color:var(--ink-2)}
.vinfo .face{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--clay);margin:12px 0 22px}
.fbars{display:grid;gap:12px}
.fbar span{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);margin-bottom:5px}
.fbar span b{color:var(--ink);font-variant-numeric:tabular-nums}
.fbar div{height:8px;border-radius:6px;background:rgba(34,40,31,.08);overflow:hidden}
.fbar div i{display:block;height:100%;border-radius:6px;width:0;transition:width 1s var(--ease)}
.vtot{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.vtot b{font-family:var(--serif);font-weight:400;font-size:40px;font-variant-numeric:tabular-nums}
.vtot span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
@media (max-width:1000px){.inner.villas,.vcard{grid-template-columns:1fr;overflow:auto;align-content:start}}

/* ================= land use ================= */
.inner.landuse{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,4vw,70px);align-items:center}
.donut{position:relative;width:min(44vh,480px);aspect-ratio:1;margin:auto}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:15;transition:stroke-dasharray 1.4s var(--ease),stroke-width .3s,opacity .3s}
.donut circle.seg{cursor:pointer}
.donut circle.seg:hover,.donut circle.seg.on{stroke-width:19}
.donut .ctr{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.donut .ctr b{display:block;font-family:var(--serif);font-weight:300;font-size:clamp(40px,4.4vw,72px);line-height:1;font-variant-numeric:tabular-nums}
.donut .ctr span{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(238,240,230,.7)}
.ulist{display:grid;gap:0;margin-top:26px;border-top:1px solid rgba(255,255,255,.14)}
.urow{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:16px;align-items:baseline;padding:13px 4px;border-bottom:1px solid rgba(255,255,255,.12);font-size:15px;transition:background .25s}
.urow.on{background:rgba(255,255,255,.06)}
.urow i{width:12px;height:12px;border-radius:50%;align-self:center}
.urow b{font-variant-numeric:tabular-nums;font-weight:500}
.urow small{color:rgba(238,240,230,.6);font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
@media (max-width:1000px){.inner.landuse{grid-template-columns:1fr;overflow:auto;align-content:start}}

/* ================= club house ================= */
.inner.club{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(24px,4vw,70px);align-items:center}
.tower{display:grid;gap:6px;margin-top:28px;max-width:560px}
.floor{display:grid;grid-template-columns:150px minmax(0,1fr) 82px;gap:14px;align-items:center;font-size:13px}
.floor .lbl{color:var(--ink-2);letter-spacing:.04em}
.floor .slab{height:30px;border-radius:6px;background:linear-gradient(90deg,var(--c1),var(--c2));transform-origin:left;transform:scaleX(0);transition:transform 1.1s var(--ease)}
.is-active .floor .slab{transform:scaleX(var(--s));transition-delay:calc(var(--d) * 140ms + .5s)}
.floor b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.floor.sum{border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.floor.sum .lbl,.floor.sum b{color:var(--ink);font-weight:700}
.sheets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:12px;height:min(64vh,620px)}
.sheet{border:1px solid var(--line);border-radius:14px;background:#fff;padding:8px;text-align:left;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:6px;min-height:0;font-size:12px;cursor:zoom-in;transition:transform .35s var(--ease),box-shadow .35s}
.sheet:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(20,30,15,.14)}
.sheet img{width:100%;height:100%;min-height:0;object-fit:contain;background:#fff}
.sheet b{color:var(--clay)}
.sheet:first-child{grid-column:span 2;grid-row:span 2}

@media (max-width:1000px){.inner.club{grid-template-columns:1fr;overflow:auto;align-content:start}}

/* ================= gate ================= */
.gate .stage{position:absolute;inset:0;z-index:0;background:#111}
.gate .stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gate .stage .gimg{opacity:0;transition:opacity 1s var(--ease),transform 8s ease-out;transform:scale(1.06)}
.gate .stage .gimg.on{opacity:1;transform:scale(1)}
.gate .wipe{position:absolute;inset:0;z-index:2;display:none}
.gate.cmp .wipe{display:block}
.gate .wipe img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gate .wipe .top{clip-path:inset(0 calc(100% - var(--x,50%)) 0 0)}
.gate .handle{position:absolute;top:0;bottom:0;left:var(--x,50%);width:2px;background:#fff;transform:translateX(-1px);cursor:ew-resize;touch-action:none}
.gate .handle::after{content:"‹ ›";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:#fff;color:var(--forest);display:grid;place-items:center;font-size:18px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.gate .wl{position:absolute;top:calc(90px + 2vh);padding:6px 12px;border-radius:99px;background:rgba(10,14,9,.6);color:#fff;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.gate .inner{display:grid;align-content:end;pointer-events:none}
.gate .inner>*{pointer-events:auto}
.gpanel{max-width:560px;padding:24px 26px;border-radius:22px;background:rgba(10,14,9,.55);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.14)}
.gtabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.gtabs button{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.22);background:none;border-radius:99px;padding:6px 12px 6px 6px;font-size:12.5px;color:rgba(255,255,255,.8);transition:background .3s,color .3s}
.gtabs button i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;background:rgba(255,255,255,.14)}
.gtabs button[aria-pressed="true"]{background:#fff;color:var(--forest)}
.gtabs button[aria-pressed="true"] i{background:var(--clay);color:#fff}
.gpanel h3{font-size:clamp(28px,2.6vw,42px);margin-bottom:10px}
.gpanel p{font-size:14.5px;line-height:1.6;color:rgba(238,240,230,.82);margin:0}
.gfeats{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.gfeats span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:5px 10px;border-radius:99px;border:1px solid rgba(255,255,255,.22);color:rgba(255,255,255,.85)}
.gcmp{display:flex;gap:10px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.14);font-size:12.5px;color:rgba(255,255,255,.75);flex-wrap:wrap}
.gcmp select{font:inherit;font-size:12.5px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:4px 6px}
.gcmp select option{color:#000}
.swtch{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:#fff;font-size:12.5px;padding:0}
.swtch i{width:36px;height:20px;border-radius:99px;background:rgba(255,255,255,.25);position:relative;transition:background .3s}
.swtch i::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .3s var(--ease)}
.swtch[aria-pressed="true"] i{background:var(--sprout)}
.swtch[aria-pressed="true"] i::after{transform:translateX(16px)}

/* ================= streets ================= */
.widths{display:grid;gap:34px;margin-top:40px;max-width:1100px}
.wrow{display:grid;grid-template-columns:96px minmax(0,1fr);gap:20px;align-items:center}
.wrow .t{font-family:var(--serif);font-size:34px;font-weight:300}
.wrow .t small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.14em;color:var(--ink-2)}
.wbar{display:flex;justify-content:center;height:52px}
.wbar div{height:100%;display:grid;place-items:center;font-size:11.5px;font-weight:600;color:rgba(0,0,0,.6);transform:scaleY(0);transform-origin:bottom;transition:transform .8s var(--ease)}
.is-active .wbar div{transform:none;transition-delay:calc(var(--o) * 120ms + .6s)}
.wkey{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-top:6px}
.wkey i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.road .inner{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(330px,.9fr);gap:clamp(20px,3vw,48px);align-items:center}
.gal{display:grid;gap:12px;min-width:0}
.gmain{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:16/10;background:#2a3326;box-shadow:0 30px 70px rgba(20,30,15,.22);max-height:62vh}
.gmain img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1s var(--ease)}
.gmain img.on{opacity:1;animation:kb 9s ease-out forwards}
.gmain .gc{position:absolute;left:14px;bottom:14px;z-index:2;padding:6px 12px;border-radius:99px;background:rgba(10,14,9,.6);color:#fff;font-size:12.5px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.road .strip button{width:clamp(70px,6vw,100px)}
.road .strip button.on{border-color:var(--clay)}
.road .strip button .bar{background:var(--clay)}
.secsvg{width:100%;height:auto;margin-top:22px}
.secsvg .g{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .8s var(--ease)}
.is-active .secsvg .g{transform:none;transition-delay:calc(var(--o) * 90ms + .5s)}
.secsvg .tree{transform-box:fill-box;transform-origin:bottom;transform:scale(0);transition:transform 1s cubic-bezier(.3,1.4,.5,1)}
.is-active .secsvg .tree{transform:none;transition-delay:calc(var(--o) * 120ms + 1.2s)}
.secsvg .dim{opacity:0;transition:opacity .6s}
.is-active .secsvg .dim{opacity:1;transition-delay:calc(var(--o) * 80ms + 1.6s)}
.secsvg text{font-family:var(--sans);font-size:11px;fill:var(--ink-2)}
.zrows{display:grid;gap:0;margin-top:16px;border-top:1px solid var(--line)}
.zrows div{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.zrows i{width:10px;height:10px;border-radius:3px;align-self:center}
.zrows small{color:var(--ink-2);font-variant-numeric:tabular-nums}
@media (max-width:1000px){.road .inner{grid-template-columns:1fr;overflow:auto;align-content:start}}

/* ================= day timeline ================= */
.dayline .inner{display:grid;align-content:center}
.skybg{position:absolute;inset:0;z-index:0;transition:background 1.2s linear}
.dayline::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(10,14,9,.55),rgba(10,14,9,.18) 55%,rgba(10,14,9,.4))}
.dayline .inner{z-index:2}
.sunarc text{paint-order:stroke;stroke:rgba(10,14,9,.35);stroke-width:3px}
.sunarc{width:100%;height:auto;margin-top:30px;overflow:visible}
.sunarc .arc{fill:none;stroke:rgba(255,255,255,.28);stroke-width:1.5;stroke-dasharray:4 6}
.sunarc .hz{stroke:rgba(255,255,255,.35);stroke-width:1}
.sunarc .tick text{fill:rgba(255,255,255,.6);font-family:var(--sans);font-size:12px;letter-spacing:.08em}
.sunarc .tick line{stroke:rgba(255,255,255,.3)}
.sunarc .sun circle.core{fill:#FFE3A1}
.sunarc .sun circle.glow{fill:rgba(255,214,120,.25)}
.sunarc .am{cursor:pointer}
.sunarc .am circle{fill:#fff;stroke:rgba(0,0,0,.2);transition:r .3s}
.sunarc .am text{fill:#fff;font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.06em}
.sunarc .am text.t{font-weight:400;fill:rgba(255,255,255,.7);font-size:12px}
.sunarc .am line{stroke:rgba(255,255,255,.45)}
.sunarc .am:hover circle,.sunarc .am.on circle{r:11}
.sunarc .am{opacity:0;transition:opacity .6s}
.is-active .sunarc .am{opacity:1;transition-delay:calc(var(--o) * 160ms + .8s)}
.daycard{position:absolute;z-index:3;width:250px;border-radius:16px;overflow:hidden;background:rgba(10,14,9,.7);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);color:#fff;box-shadow:0 20px 50px rgba(0,0,0,.35);pointer-events:none;opacity:0;transition:opacity .3s,transform .3s;transform:translateY(8px)}
.daycard.on{opacity:1;transform:none}
.daycard img{width:100%;aspect-ratio:16/10;object-fit:cover}
.daycard div{padding:10px 12px;font-size:13px}
.daycard small{display:block;color:var(--gold);font-size:11px;letter-spacing:.14em;text-transform:uppercase}

/* ================= amenity ================= */
.amen .inner{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);align-content:end;gap:30px;align-items:end}
.amen .ano{font-family:var(--serif);font-weight:300;font-size:clamp(70px,9vw,150px);line-height:.8;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.6);margin-bottom:14px}
.amen h2{font-size:clamp(44px,5.2vw,90px)}
.amen .gside{justify-self:end;display:grid;gap:10px;max-width:min(640px,100%);min-width:0}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:22px}
.ptabs button{border:1px solid rgba(255,255,255,.28);background:rgba(10,14,9,.35);color:#fff;border-radius:99px;padding:7px 14px;font-size:12.5px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:background .3s,color .3s}
.ptabs button b{color:var(--gold);margin-right:6px}
.ptabs button[aria-pressed="true"]{background:#fff;color:var(--forest)}
.ptabs button[aria-pressed="true"] b{color:var(--clay)}
.pline{transition:opacity .4s}
@media (max-width:900px){.amen .inner{grid-template-columns:1fr}.amen .gside{justify-self:start}}

/* ================= closing ================= */
.closing .inner{display:grid;align-content:center;justify-items:center;text-align:center}
.closing h2{font-size:clamp(60px,10vw,180px)}
.recap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:46px;max-width:1100px;width:100%;border-top:1px solid rgba(255,255,255,.18)}
.recap div{padding:20px 14px 0;border-right:1px solid rgba(255,255,255,.14);text-align:left}
.recap div:last-child{border-right:0}
.recap b{display:block;font-family:var(--serif);font-weight:300;font-size:clamp(28px,2.8vw,46px);font-variant-numeric:tabular-nums}
.recap span{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(238,240,230,.7)}
.disc{font-size:11.5px;color:rgba(238,240,230,.55);max-width:70ch;margin-top:40px;line-height:1.6}
.again{margin-top:26px}
@media (max-width:800px){.recap{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ================= lightbox & sheet ================= */
.lb{position:fixed;inset:0;z-index:60;background:rgba(6,9,5,.96);display:grid;grid-template-rows:minmax(0,1fr) auto;opacity:0;pointer-events:none;transition:opacity .35s}
.lb.open{opacity:1;pointer-events:auto}
.lb .lbimg{position:relative;min-height:0;display:grid;place-items:center;padding:calc(60px + var(--safe-t)) 70px 10px}
.lb .lbimg img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 30px 80px rgba(0,0,0,.6);transition:opacity .3s}
.lb .lbbar{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px var(--pad) calc(18px + var(--safe-b));color:#fff;font-size:14px}
.lb .lbbar span{opacity:.7}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%)}
.lb .prev{left:14px}.lb .next{right:14px}
.lb .x{position:absolute;top:calc(14px + var(--safe-t));right:14px}
.sheetm{position:fixed;inset:0;z-index:60;background:rgba(6,9,5,.8);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:center;padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b))}
.smbox{width:min(1400px,100%);height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);background:#fff;border-radius:20px;overflow:hidden}
.smhead{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:600}
.smhead span{flex:1}
.smhead button{border:1px solid var(--line);background:none;border-radius:99px;padding:6px 14px;font-size:13px}
.smbody{position:relative;min-height:0}
.smbody .mapbox{height:100%}

.toast{position:fixed;z-index:50;left:50%;top:calc(80px + var(--safe-t));transform:translateX(-50%);background:rgba(10,14,9,.85);color:#fff;border-radius:99px;padding:8px 16px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.on{opacity:1}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.2s!important}
}
@media (max-width:720px){
  .inner{padding:calc(70px + 1vh) 18px calc(86px + 1vh);overflow:auto}
  .ui-count{display:none}
}

/* ------------------------------------------------ build DOM */
const CH=["Prologue","The land","The plan","Arriving home","The walk home","A day at Edge","Epilogue"];
const deck=$('#deck');
S.forEach((s,i)=>{const sec=document.createElement('section');sec.className='slide'+(s.dark?' dark':'')+(s.cls?' '+s.cls:'');sec.id='s-'+s.id;sec.setAttribute('aria-label',s.title);sec.dataset.i=i;sec.innerHTML=s.html;deck.appendChild(sec);s.el=sec;});
$('#count').innerHTML=`<b>01</b>/ ${String(S.length).padStart(2,'0')}`;
// chapter nav
const chNav=$('#chapters');
S.forEach((s,i)=>{const b=document.createElement('button');b.setAttribute('aria-label',`${i+1}. ${s.title}`);b.title=s.title;b.innerHTML='<i></i>';b.onclick=()=>go(i);chNav.appendChild(b)});
// overview
$('#ovBody').innerHTML=CH.map((c,ci)=>{const items=S.map((s,i)=>[s,i]).filter(([s])=>s.ch===ci);if(!items.length)return'';
 return `<h4><small>${ci?('Chapter '+ci):''}</small>${c}</h4><div class="ov-grid">${items.map(([s,i])=>`<button class="ov" data-go="${i}"><div class="th" ${s.thumb?`data-bgsrc="${TH(s.thumb)}"`:'style="background:linear-gradient(135deg,#e3ecf7,#efeaf7)"'}></div><span><b>${String(i+1).padStart(2,'0')}</b>${esc(s.title)}</span></button>`).join('')}</div>`}).join('');

/* ------------------------------------------------ navigation */
let cur=-1, lock=false;
function load(i){const s=S[i];if(!s)return;$$('[data-src]',s.el).forEach(im=>{im.src=im.dataset.src;im.removeAttribute('data-src')});if(s.init&&!s.inited){s.inited=true;try{s.init(s.el)}catch(e){console.error(e)}}}
let clockH=6, clockTo=null;
function setClock(h){cancelAnimationFrame(clockTo);const from=clockH,t0=performance.now(),dur=1100;
 const step=t=>{const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);clockH=from+(h-from)*e;$('#clockT').textContent=hhmm(Math.min(clockH,23.99));
   const night=clockH<5.8||clockH>19.2;$('#rays').style.opacity=night?0:1;$('#sunIcon').setAttribute('r',night?6:5);

 const typeBlock=(t,cur)=>`<div class="ftab"><div><b>${fmt(t.gf)}</b><span>Ground sft</span></div><div><b>${fmt(t.ff)}</b><span>First sft</span></div><div><b>${fmt(t.sf)}</b><span>Second sft</span></div><div><b>${fmt(t.tot)}</b><span>Total sft</span></div></div>
  <p class="hint">${t.size} sq.yd site · ${t.sqm} sq.m · ${t.plots.length} plot${t.plots.length>1?'s':''} on the layout</p>
  <div class="pch">${t.plots.map(n=>`<button data-p="${n}" class="${n===cur?'cur':''}">${String(n).padStart(2,'0')}</button>`).join('')}</div>
  <button class="vplan" data-sheet="${t.k}" data-title="${tName(t)} · floor plan"><img src="plan/${t.k}.webp" alt="Floor plan" loading="lazy"></button><p class="hint" style="margin-top:6px">Tap the plan to open and zoom.</p>`;
 const wire=()=>$$('.pch button',det).forEach(b=>b.onclick=()=>selPlot(+b.dataset.p,true));
 const clearSel=()=>{Object.values(shapes).forEach(s=>s.classList.remove('sel'));cr.classList.remove('sel')};
 function selPlot(n,fly){const p=byP[n];if(!p)return;clearSel();shapes[n].classList.add('sel');const t=p.t&&T[p.t];
  det.innerHTML=`<div style="display:flex;align-items:baseline;gap:12px"><span class="bignum" style="color:${t?t.color:'inherit'}">${String(n).padStart(2,'0')}</span><span class="hint">Plot · ${p.s||'?'} sq.yd</span></div>${t?`<h3 style="margin-top:8px">${tName(t)}</h3>${typeBlock(t,n)}`:'<p class="hint">No floor plan shown for this plot.</p>'}`;wire();
  if(fly)pz.focus(p.kc[0],p.kc[1],380)}
 function showType(k){const t=T[k];clearSel();det.innerHTML=`<div style="display:flex;align-items:center;gap:10px"><i style="width:16px;height:16px;border-radius:4px;background:${t.color};display:inline-block"></i><h3 style="margin:0">${tName(t)}</h3></div>${typeBlock(t)}`;wire()}
 function selClub(){clearSel();cr.classList.add('sel');det.innerHTML=`<h3>Club house</h3><p class="hint">Basement + 4 floors + terrace amenities.</p>${M.clubArea.map(([l,v])=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px${/total/i.test(l)?';font-weight:700':''}"><span>${l}</span><span>${fmt(v)} sft</span></div>`).join('')}<p class="hint" style="margin-top:10px"><a href="#club" data-go="${S.findIndex(s=>s.id==='club')}">See the club house plans →</a></p>`}
 function intro(){det.innerHTML=`<h3>Master layout</h3><p class="hint">Tap any plot for its villa type, floor areas and plan. Tap the club house for its areas. Tap a type below to light up every plot of that type.</p><div class="legend">${M.types.map(t=>`<button data-k="${t.k}"><i style="background:${t.color}"></i>${tName(t)} · ${t.plots.length}</button>`).join('')}</div>`;
  $$('.legend button',det).forEach(b=>b.onclick=()=>filterType(b.dataset.k))}
 intro();
 const s=S.find(x=>x.el===sl); s.onEnter=()=>{pz.focus(690,490,1380);Object.values(shapes).forEach(sh=>{sh.classList.remove('wave');void sh.getBBox;setTimeout(()=>{sh.classList.add('wave');sh.addEventListener('animationend',()=>sh.classList.remove('wave'),{once:true})},700)})};
 if(sl.classList.contains('is-active'))s.onEnter();

function initVillas(sl){
 const list=$('#vlist'),info=$('#vinfo'),plan=$('#vplan');
 list.innerHTML=M.types.map((t,i)=>`<button class="vrow" data-k="${t.k}"><i style="background:${t.color}"></i><span>${t.size} sq.yd · ${t.facing}${t.owner?' <small style="text-align:left">· owner plot</small>':''}</span><small>${t.plots.length} nos</small><b>${fmt(t.tot)}</b></button>`).join('');
 const max=Math.max(...M.types.map(t=>Math.max(t.gf,t.ff,t.sf)));
 let T0=null;

  info.innerHTML=`<div class="size">${t.size}<small>sq.yd</small></div><p class="face">${t.facing} facing · ${t.plots.length} villa${t.plots.length>1?'s':''}${t.owner?' · owner plot':''}</p>
   <div class="fbars">${[['Ground floor',t.gf],['First floor',t.ff],['Second floor',t.sf]].map(([l,v])=>`<div class="fbar"><span>${l}<b>${fmt(v)} sft</b></span><div><i style="background:${t.color}" data-w="${v/max*100}"></i></div></div>`).join('')}</div>
   <div class="vtot"><span>Total built-up</span><b>${fmt(t.tot)} sft</b></div><p class="hint" style="margin-top:6px">${t.psyd} sft per sq.yd of site</p>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>$$('.fbar i',info).forEach(i=>i.style.width=i.dataset.w+'%')));
  const im=$('img',plan);im.style.opacity=0;setTimeout(()=>{im.src=`plan/${k}.webp`;im.onload=()=>im.style.opacity=1},200);
  plan.dataset.sheet=k;plan.dataset.title=tName(t)+' · floor plan'};
 $$('.vrow',list).forEach(r=>r.onclick=()=>{show(r.dataset.k);clearInterval(T0)});
 show(M.types[1].k);
 const s=S.find(x=>x.el===sl);let ix=1;
 s.onEnter=()=>{clearInterval(T0);T0=setInterval(()=>{ix=(ix+1)%M.types.length;show(M.types[ix].k)},5000);list.addEventListener('pointerdown',()=>clearInterval(T0),{once:true})};
 s.onLeave=()=>clearInterval(T0);
}

function initLanduse(sl){
 const D=M.division, tot=D.reduce((a,b)=>a+b[1],0), cols=["#E2B86B","#B0603F","#9DB267","#6E7E54","#8E9488"];
 const names={"Plotted area (107 plots)":"Villa plots (107)","Roads (balance)":"Roads"};
 const svg=$('#donut'),R=78,C=2*Math.PI*R;
 el('circle',{cx:100,cy:100,r:R,stroke:'rgba(255,255,255,.08)'},svg);
 let acc=0;const segs=D.map(([l,v],i)=>{const c=el('circle',{cx:100,cy:100,r:R,stroke:cols[i],class:'seg','stroke-dasharray':`0 ${C}`,'stroke-dashoffset':-acc/tot*C},svg);c.dataset.len=(v/tot*C-1.2);acc+=v;return c});
 $('#ulist').innerHTML=D.map(([l,v],i)=>`<div class="urow" data-i="${i}"><i style="background:${cols[i]}"></i><span>${names[l]||l}</span><b>${fmt(Math.round(v))} sq.m</b><small>${(v/tot*100).toFixed(1)}%</small></div>`).join('');
 const hi=i=>{segs.forEach((s,j)=>{s.classList.toggle('on',j===i);s.style.opacity=i===null||j===i?1:.35});$$('.urow',sl).forEach((r,j)=>r.classList.toggle('on',j===i));
  if(i===null){$('#dVal').textContent='52,127';$('#dLab').textContent='sq.m net site'}else{$('#dVal').textContent=(D[i][1]/tot*100).toFixed(1)+'%';$('#dLab').textContent=names[D[i][0]]||D[i][0]}};
 segs.forEach((s,i)=>{s.addEventListener('mouseenter',()=>hi(i));s.addEventListener('mouseleave',()=>hi(null))});
 $$('.urow',sl).forEach((r,i)=>{r.addEventListener('mouseenter',()=>hi(i));r.addEventListener('mouseleave',()=>hi(null))});
 const s=S.find(x=>x.el===sl);
 s.onEnter=()=>{segs.forEach(c=>c.setAttribute('stroke-dasharray',`0 ${C}`));setTimeout(()=>segs.forEach((c,i)=>setTimeout(()=>c.setAttribute('stroke-dasharray',`${c.dataset.len} ${C}`),i*180)),500)};
 if(sl.classList.contains('is-active'))s.onEnter();
}

}

 W.innerHTML=[ROADS.r40,ROADS.r30].map(R=>{const segs=[...R.zones,...R.zones.slice(0,-1).reverse()];const mid=R.zones.length-1;
  return `<div class="wrow"><div class="t">${R.w}′<small>${R.m}</small></div><div class="wbar">${segs.map((z,i)=>`<div style="width:${z[1]*scale}%;background:${z[2]};--o:${Math.abs(i-mid)};${z[0]==='Carriageway'?'color:rgba(255,255,255,.75)':''}">${z[1]}′</div>`).join('')}</div></div>`}).join('')+
  `<div class="wkey">${ROADS.r40.zones.map(z=>`<span><i style="background:${z[2]}"></i>${z[0]}</span>`).join('')}</div>`;

function sectionSVG(R,k){
 const segs=[...R.zones,...R.zones.slice(0,-1).reverse()];const W=640,wall=10,usable=W-2*wall-60,sc=usable/R.w;let x=30+wall;
 let out=`<svg class="secsvg" viewBox="0 0 ${W} 200" role="img" aria-label="Section of the ${R.w} foot road">`;
 out+=`<rect x="0" y="152" width="${W}" height="6" fill="#D6CBB5"/>`;
 out+=`<rect class="g" style="--o:0" x="20" y="96" width="${wall}" height="58" fill="#8D8A7E"/><rect class="g" style="--o:0" x="${W-30}" y="96" width="${wall}" height="58" fill="#8D8A7E"/>`;
 out+=`<rect class="g" style="--o:0" x="0" y="60" width="18" height="94" fill="#ECE6DA"/><rect class="g" style="--o:0" x="${W-18}" y="60" width="18" height="94" fill="#ECE6DA"/>`;
 const mid=R.zones.length-1;
 segs.forEach((z,i)=>{const w=z[1]*sc,o=Math.abs(i-mid);const y=z[0]==='Carriageway'?146:(z[0]==='Footpath'?140:138);
  out+=`<rect class="g" style="--o:${o}" x="${x}" y="${y}" width="${w}" height="${152-y}" fill="${z[2]}"/>`;
  if(z[0]==='Carriageway'){out+=`<line class="dim" style="--o:4" x1="${x+w/2}" y1="149" x2="${x+w/2}" y2="149" stroke="#fff"/>`;for(let d=x+10;d<x+w-10;d+=22)out+=`<rect class="dim" style="--o:4" x="${d}" y="148.5" width="11" height="1.6" fill="#E9E4D4"/>`}
  const treeHere=(k==='r40'&&z[0]==='Tree strip')||(k==='r30'&&z[0]==='Landscape strip');
  if(treeHere){const cx=x+w/2;out+=`<g class="tree" style="--o:${o}"><rect x="${cx-2}" y="86" width="4" height="${y-86}" fill="#6E5C47"/><circle cx="${cx}" cy="70" r="${k==='r40'?30:24}" fill="#9C8ACF" opacity=".9"/><circle cx="${cx-14}" cy="80" r="16" fill="#BCAFE6" opacity=".85"/><circle cx="${cx+15}" cy="78" r="17" fill="#7564AD" opacity=".8"/></g>`}
  else if(z[0]==='Landscape strip'){const cx=x+w/2;out+=`<g class="tree" style="--o:${o}"><circle cx="${cx-3}" cy="132" r="7" fill="#6D8946"/><circle cx="${cx+4}" cy="130" r="6" fill="#DE8BAB"/></g>`}
  out+=`<g class="dim" style="--o:${o}"><line x1="${x}" y1="172" x2="${x}" y2="180" stroke="#999"/><line x1="${x+w}" y1="172" x2="${x+w}" y2="180" stroke="#999"/><line x1="${x}" y1="176" x2="${x+w}" y2="176" stroke="#bbb"/><text x="${x+w/2}" y="194" text-anchor="middle">${z[1]}′</text></g>`;
  x+=w});
 out+=`<g class="dim" style="--o:6"><text x="${W/2}" y="26" text-anchor="middle" style="font-size:12px;letter-spacing:.2em;fill:var(--ink)">${R.w}′-0″ · ${R.m}</text><line x1="40" y1="34" x2="${W-40}" y2="34" stroke="#bbb"/></g>`;
 return out+'</svg>';
}

function initDay(sl){
 const svg=$('#sunarc'),W=1400,H=420,x0=60,x1=W-60,base=360,top=60;
 const X=h=>x0+(h-5.5)/(20.5-5.5)*(x1-x0);const Y=h=>{const t=(h-5.5)/15;return base-Math.sin(t*Math.PI)*(base-top)};
 let d='';for(let h=5.5;h<=20.5;h+=.1)d+=(d?'L':'M')+X(h).toFixed(1)+' '+Y(h).toFixed(1);
 el('path',{d,class:'arc'},svg);el('line',{x1:20,x2:W-20,y1:base,y2:base,class:'hz'},svg);
 for(let h=6;h<=20;h+=2){const g=el('g',{class:'tick'},svg);el('line',{x1:X(h),x2:X(h),y1:base,y2:base+8},g);const t=el('text',{x:X(h),y:base+28,'text-anchor':'middle'},g);t.textContent=hhmm(h)}
 const items=[...AMEN.map(a=>({id:a.id,h:a.h,t:a.t,n:a.short,c:a.shots[0][0],no:a.no})),{id:'sit-out-parks',h:18.75,t:'18:45',n:'Sit-out parks',c:'P1-01',no:'10'}];
 const sun=el('g',{class:'sun'},svg);el('circle',{r:34,class:'glow'},sun);el('circle',{r:16,class:'core'},sun);
 const card=$('#dayCard');
 items.forEach((it,i)=>{const g=el('g',{class:'am',tabindex:0,role:'button','aria-label':`${it.t} ${it.n}`},svg);g.style.setProperty('--o',i);
  const up=i%2===0;const ly=Y(it.h)+(up?-58:58);
  el('line',{x1:X(it.h),x2:X(it.h),y1:Y(it.h),y2:ly+(up?10:-14)},g);el('circle',{cx:X(it.h),cy:Y(it.h),r:7},g);
  const t=el('text',{x:X(it.h),y:ly,'text-anchor':'middle'},g);t.textContent=it.n.toUpperCase();const t2=el('text',{x:X(it.h),y:ly+(up?-18:18),'text-anchor':'middle',class:'t'},g);t2.textContent=it.t;
  const show=()=>{$$('.am',svg).forEach(a=>a.classList.remove('on'));g.classList.add('on');$('img',card).src=TH(it.c);$('div',card).innerHTML=`<small>${it.t}</small><b>${it.n}</b>`;
   const r=g.getBoundingClientRect(),P=card.parentElement.getBoundingClientRect();card.style.left=Math.max(0,Math.min(P.width-250,r.left-P.left+r.width/2-125))+'px';card.style.top=(r.top-P.top-200)+'px';card.classList.add('on')};
  g.addEventListener('mouseenter',()=>{hover=true;show()});g.addEventListener('mouseleave',()=>{hover=false;card.classList.remove('on')});
  g.addEventListener('click',()=>go(S.findIndex(s=>s.id===it.id)));g.addEventListener('keydown',e=>{if(e.key==='Enter'){e.stopPropagation();go(S.findIndex(s=>s.id===it.id))}});
  it.show=show});
 let hover=false,raf=null,t0=0;
 const tick=t=>{if(!sl.classList.contains('is-active'))return;const k=((t-t0)/14000)%1;const h=5.5+k*15;
  sun.setAttribute('transform',`translate(${X(h)},${Y(h)})`);$('#dayT').textContent=hhmm(h);
  const [a,b]=skyAt(h);$('#daySky').style.background=`linear-gradient(180deg,${a},${b})`;
  if(!hover){const near=items.find(it=>Math.abs(it.h-h)<.25);if(near&&!near._on){items.forEach(x=>x._on=false);near._on=true;near.show()}else if(!near&&items.some(x=>x._on)){items.forEach(x=>x._on=false);card.classList.remove('on');$$('.am',svg).forEach(a=>a.classList.remove('on'))}}
  raf=requestAnimationFrame(tick)};
 const s=S.find(x=>x.el===sl);s.onEnter=()=>{t0=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)};s.onLeave=()=>cancelAnimationFrame(raf);
 if(sl.classList.contains('is-active'))s.onEnter();
}
